name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} installer
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            command: pnpm release:mac
            artifact: macos-installer
          - label: Windows
            os: windows-latest
            command: pnpm release:win
            artifact: windows-installer

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check signing secrets are present
        if: matrix.label == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -uo pipefail
          missing=
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is empty or unset"
              missing=1
            fi
          done
          # An empty secret otherwise surfaces much later as an opaque
          # SecKeychainItemImport or notarytool failure.
          [ -z "$missing" ] || exit 1

      - name: Import Developer ID certificate
        if: matrix.label == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          # Without this the keychain relocks mid-build and codesign fails.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"

      - name: Write App Store Connect API key
        if: matrix.label == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          chmod 600 "$RUNNER_TEMP/api-key.p8"

      - name: Build release artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.label == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.label == 'macOS' && format('{0}/api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ${{ matrix.command }}

      - name: Verify the macOS build is signed, notarized and stapled
        if: matrix.label == 'macOS'
        run: |
          set -euo pipefail
          installer="$(find out/release -name '*-macOS-universal.dmg' -print -quit)"
          [ -n "$installer" ] || { echo "no macOS installer found"; exit 1; }
          # Fails unless a notarization ticket is attached to the disk image.
          xcrun stapler validate "$installer"
          # Mounts the image and asks Gatekeeper the same question a user's Mac
          # will ask, so an unsigned or unnotarized app cannot ship silently.
          mountpoint="$(mktemp -d)"
          hdiutil attach "$installer" -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" -quiet || true' EXIT
          app="$mountpoint/Practice Activity.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Remove signing credentials
        if: matrix.label == 'macOS' && always()
        run: |
          rm -f "$RUNNER_TEMP/api-key.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Test Windows installer end to end
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem `
              -Path "out/release" `
              -Filter "*-Windows-x64-Setup.exe" `
              -File `
              -Recurse
          )
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)"
          }
          ./scripts/test-windows-installer.ps1 -InstallerPath $installers[0].FullName

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/release/v*/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: "*-installer"
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi
